#!/usr/sbin/nft -f
# mr-signer GCP VM firewall (rev 15). Defense in depth INSIDE the VM; the VPC firewall policy (README.md) is the
# outer layer. No external IP: internet egress goes through Cloud NAT; Google APIs through Private Google Access.
# Default drop both ways.
#  - ingress: SSH and the signer port only from Google's IAP TCP-forwarding range 35.235.240.0/20
#  - metadata server 169.254.169.254: token endpoint (HTTP 80) only for mr-piv (the helper) and root (guest agent);
#    DNS (53) only for systemd-resolved. A compromised mr-signer can NOT get the SA token.
#  - Private Google Access VIP private.googleapis.com 199.36.153.8/30:443 only for mr-piv (Cloud KMS)
#  - HTTPS to the pinned providers / ntfy / hc-ping / B2 only for mr-signer (@https_allowed, mr-egress-refresh)
flush ruleset

define IAP_RANGE = 35.235.240.0/20
define SIGNER_PORT = 8787
define MDS = 169.254.169.254
define PGA = 199.36.153.8/30

table inet mr {
  set https_allowed4 { type ipv4_addr; flags interval, timeout; timeout 2h; }

  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    ip saddr $IAP_RANGE tcp dport { 22, $SIGNER_PORT } ct state new accept
    ip protocol icmp icmp type { echo-request } limit rate 5/second accept
    log prefix "mr-drop-in " level info limit rate 10/minute drop
  }

  chain forward { type filter hook forward priority 0; policy drop; }

  chain output {
    type filter hook output priority 0; policy drop;
    ct state established,related accept
    oif lo accept
    ip daddr $MDS tcp dport 80 meta skuid { "mr-piv", "root" } accept
    ip daddr $MDS udp dport 53 meta skuid "systemd-resolve" accept
    ip daddr $MDS tcp dport 53 meta skuid "systemd-resolve" accept
    ip daddr $PGA tcp dport 443 meta skuid "mr-piv" accept
    ip daddr $MDS udp dport 123 meta skuid "_chrony" accept
    meta skuid "_chrony" tcp dport 4460 accept
    meta skuid "_chrony" udp dport 123 accept
    meta skuid "mr-signer" ip daddr @https_allowed4 tcp dport 443 accept
    log prefix "mr-drop-out " level info limit rate 10/minute drop
  }
}
