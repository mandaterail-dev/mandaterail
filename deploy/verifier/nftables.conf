#!/usr/sbin/nft -f
# mr-verifier host firewall (rev 14), the verifier's own host (deploy/verifier). Default drop both ways. Ingress: WireGuard UDP on the uplink, and the verifier
# port only from the CLI peer inside wg0. Egress: DNS to the local resolver, NTS/NTP for chrony, HTTPS (the app
# pins hosts; DNS answers are cached into @https_allowed by mr-egress-refresh.timer from egress-hosts.conf, R51-P3-1).
flush ruleset

define WG_PORT = 51820
define VERIFIER_PORT = 8788
define CLI_PEER = 10.77.0.2
# R63-P3e: IMDS + KMS_VPCE come from deploy/verifier/platform/<platform>.nft via render-platform.sh
# (aliyun | aliyun-softkey). This checked-in copy is the aliyun render.
# @platform-begin (generated; do not edit between the markers)
# aliyun (deploy/aliyun, rev 22): ECS metadata service (RAM role STS credentials, tokens required). KMS is reached
# by name through the OpenAPI VPC endpoint (egress-hosts), so no fixed KMS address: 127.0.0.2 matches nothing.
define IMDS = 100.100.100.200
define KMS_VPCE = { 127.0.0.2 }
# @platform-end

table inet mr {
  set https_allowed4 { type ipv4_addr; flags interval, timeout; timeout 2h; }
  set https_allowed6 { type ipv6_addr; flags interval, timeout; timeout 2h; }

  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    udp dport $WG_PORT accept
    iifname "wg0" ip saddr $CLI_PEER tcp dport $VERIFIER_PORT ct state new accept
    ip protocol icmp icmp type { echo-request } limit rate 5/second accept
    ip6 nexthdr icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request } accept
    log prefix "mr-drop-in " level info limit rate 10/minute drop
  }

  chain forward { type filter hook forward priority 0; policy drop; }

  chain output {
    type filter hook output priority 0; policy drop;
    ct state established,related accept
    oif lo accept
    # R47-P3: WireGuard is a kernel socket (no skuid); only packets FROM its listen port to UDP, not any uid to 51820
    udp sport $WG_PORT accept
    # wg0 egress only for the verifier itself (replies to the CLI are ct established); nothing else may use the tunnel
    oifname "wg0" meta skuid "mr-verifier" accept
    meta skuid "systemd-resolve" udp dport 53 accept
    meta skuid "systemd-resolve" tcp dport { 53, 853 } accept
    meta skuid "_chrony" tcp dport 4460 accept
    meta skuid "_chrony" udp dport 123 accept
    # IMDSv2 for the instance-role credentials: only the verifier uid (hop limit 1 also keeps it off containers)
    meta skuid "mr-verifier" ip daddr $IMDS tcp dport 80 accept
    meta skuid "mr-verifier" ip daddr $KMS_VPCE tcp dport 443 accept
    meta skuid "mr-verifier" ip daddr @https_allowed4 tcp dport 443 accept
    meta skuid "mr-verifier" ip6 daddr @https_allowed6 tcp dport 443 accept
    # R51-P3-1: everything else on 443 (any uid, any address not refreshed from egress-hosts.conf) is denied
    tcp dport 443 log prefix "mr-https-deny " level warn limit rate 10/minute drop
    ip daddr $IMDS log prefix "mr-imds-deny " level warn limit rate 10/minute drop
    log prefix "mr-drop-out " level info limit rate 10/minute drop
  }
}
