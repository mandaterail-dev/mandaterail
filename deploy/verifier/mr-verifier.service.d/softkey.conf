# rev 24 (§24.8, platform aliyun-softkey): install as /etc/systemd/system/mr-verifier.service.d/softkey.conf.
# systemd reads the 0600 key file and exposes it read-only to this service only at $CREDENTIALS_DIRECTORY/cosign.key
# (ramfs, not swappable); config.json has "softkey": {} and no path. The key never leaves the host.
[Unit]
Requires=mr-verifier-keygen.service
After=mr-verifier-keygen.service

[Service]
# R67-P3-6: fail closed before systemd copies the credential: the source must be a root:root 0600 regular file
# (no symlink, one link) in a root 0700 dir. "+" runs the check as root; the key itself is never read here.
ExecStartPre=+/opt/mr-verifier/current/deploy/verifier/mr-verifier-keygen.sh --check
LoadCredential=cosign.key:/var/lib/mr-verifier-key/cosign.key
# the verifier process itself cannot open the key directory
InaccessiblePaths=/var/lib/mr-verifier-key
