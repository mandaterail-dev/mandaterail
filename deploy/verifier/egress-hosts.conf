# R51-P3-1: the verifier's HTTPS (443) allowlist. mr-egress-refresh resolves each host through the
# local resolver (systemd-resolved, 127.0.0.53; DNSSEC not enforced, doc §22) and adds its A/AAAA records to @https_allowed4/6 with a
# 2 h timeout. Anything else on 443 is dropped (and logged as mr-https-deny). One host per line; no wildcards.
# Edit the B2 line for your bucket's region (the script refuses an unfilled <placeholder>).

# R63-P3e: generated by render-platform.sh from platform/<platform>.hosts + platform/common.hosts (this copy: aliyun).
# @hosts-begin
# aliyun: the co-signing key via the KMS OpenAPI VPC endpoint (RAM policy pins acs:SourceVpc/acs:VpcSourceIp);
# role credentials come from the metadata service (nftables IMDS), not STS over 443. Only once the owner approves a KMS instance.
kms-vpc.us-east-1.aliyuncs.com
# common to every platform (rendered after the platform block)
# GCP: Workload Identity Federation token exchange + impersonation, and the KMS audit-log read (rev 22 open item:
# from Alibaba this needs X.509 workload identity federation; GCP has no native Alibaba RAM provider)
sts.googleapis.com
iamcredentials.googleapis.com
logging.googleapis.com
