# chrony with NTS only (rev 12): authenticated time from two operators; mr-signer refuses at |offset| > 5 s.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
authselectmode require
minsources 2
maxchange 100 1 2
makestep 1 3
rtcsync
ntsdumpdir /var/lib/chrony
leapsectz right/UTC
