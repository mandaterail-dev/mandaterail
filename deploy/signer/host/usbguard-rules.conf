# usbguard (rev 12): block every USB device except the pinned YubiKey (Yubico 1050, YubiKey 5 series PIDs) by
# serial, plus the root hubs. ImplicitPolicyTarget=block and PresentDevicePolicy=apply-policy in usbguard-daemon.conf.
# Replace PINNED_SERIAL at install (same value as 70-mr-yubikey.rules and the config tokenSerial).
allow id 1d6b:* with-interface 09:00:*
allow id 1050:0407 serial "PINNED_SERIAL" with-interface one-of { 03:00:00 03:01:01 0b:00:00 }
allow id 1050:0406 serial "PINNED_SERIAL" with-interface one-of { 03:00:00 0b:00:00 }
reject
