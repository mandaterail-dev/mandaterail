<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MandateRail mandate-seal mark">
  <title>MandateRail mandate-seal</title>
  <!-- Circular seal with abstract M cutout (negative space) -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#1F6B6B" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#1F6B6B" stroke-width="1.5" opacity="0.55"/>
  <!-- Abstract M as geometric cutout — twin peaks, not letter soup -->
  <path d="M18 42 L18 24 L26 36 L32 26 L38 36 L46 24 L46 42"
        fill="none" stroke="#1F6B6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
